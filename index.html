<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="__CLINIC_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__CLINIC_TITLE__" />
    <meta property="og:description" content="__CLINIC_DESCRIPTION__" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__CLINIC_TITLE__" />
    <meta name="twitter:description" content="__CLINIC_DESCRIPTION__" />
    <meta name="theme-color" content="__CLINIC_PRIMARY__" />
    <link rel="icon" type="image/svg+xml" href="__CLINIC_FAVICON__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>__CLINIC_TITLE__</title>
    <script>
      try {
        const language =
          localStorage.getItem('nawa-language') === 'en' ? 'en' : 'ar'
        document.documentElement.lang = language
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
      } catch {
        /* Arabic is the default if storage is unavailable. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
